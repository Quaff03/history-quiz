					content: "\u6CA1\u6709\u89E3\u51B3\u8FD1\u4EE3\u4E2D\u56FD\u793E\u4F1A\u7684\u4E3B\u8981\u77DB\u76FE\uFF0C\u6CA1\u6709\u5B8C\u6210\u6C11\u65CF\u72EC\u7ACB\u3001\u4EBA\u6C11\u89E3\u653E\u7684\u5386\u53F2\u4EFB\u52A1\uFF0C\u4E2D\u56FD\u534A\u6B96\u6C11\u5730\u534A\u5C01\u5EFA\u793E\u4F1A\u7684\u6027\u8D28\u6CA1\u6709\u6539\u53D8\u3002"

				{

					unitId: "u-b8a-03",
					title: "\u8881\u4E16\u51EF\u590D\u8F9F\u8FC7\u7A0B",
					content: '\u9547\u538B\u4E8C\u6B21\u9769\u547D\u540E\uFF0C\u5F3A\u8FEB\u9009\u4E3E\u4E3A\u6B63\u5F0F\u5927\u603B\u7EDF\uFF0C\u89E3\u6563\u56FD\u6C11\u515A\u3001\u89E3\u6563\u56FD\u4F1A\uFF1B\u5E9F\u9664\u300A\u4E2D\u534E\u6C11\u56FD\u4E34\u65F6\u7EA6\u6CD5\u300B\uFF0C\u9881\u5E03\u300A\u4E2D\u534E\u6C11\u56FD\u7EA6\u6CD5\u300B\uFF1B\u4FEE\u6539\u603B\u7EDF\u9009\u4E3E\u6CD5\uFF0C\u53EF\u65E0\u9650\u671F\u8FDE\u4EFB\uFF1B1915\u5E74\u63A5\u53D7\u65E5\u672C"\u4E8C\u5341\u4E00\u6761"\u5927\u90E8\u5206\u5185\u5BB9\uFF1B1915\u5E74\u5E95\u6539\u4E2D\u534E\u6C11\u56FD\u4E3A\u4E2D\u534E\u5E1D\u56FD\uFF0C\u5E74\u53F7"\u6D2A\u5BAA"\u3002'

				{

					unitId: "u-b8a-03",
					title: "\u62A4\u56FD\u6218\u4E89",
					content: "1915\u5E74\u5E95\uFF0C\u5510\u7EE7\u5C27\u3001\u8521\u9537\u3001\u674E\u70C8\u94A7\u5728\u4E91\u5357\u5BA3\u544A\u72EC\u7ACB\uFF0C\u7EC4\u7EC7\u62A4\u56FD\u519B\u5317\u4E0A\u8BA8\u8881\u3002\u8881\u4E16\u51EF\u590D\u8F9F\u884C\u5F84\u4E0D\u5F97\u4EBA\u5FC3\uFF0C\u5317\u6D0B\u5AE1\u7CFB\u90E8\u5C5E\u9633\u5949\u9634\u8FDD\uFF0C\u4E0D\u5C11\u7701\u4EFD\u5BA3\u5E03\u72EC\u7ACB\u3002\u8881\u4E16\u51EF\u4F17\u53DB\u4EB2\u79BB\uFF0C1916\u5E74\u5E1D\u5236\u57AE\u53F0\u3002"

					unitId: "u-b8a-03",
					title: "\u5317\u6D0B\u519B\u9600\u5206\u88C2",
					content: "\u76F4\u7CFB\uFF08\u51AF\u56FD\u748B\u3001\u66F9\u951F\uFF09\uFF1A\u76F4\u96B6\u3001\u6C5F\u82CF\u3001\u6C5F\u897F\u3001\u6E56\u5317\uFF1B\u7696\u7CFB\uFF08\u6BB5\u797A\u745E\uFF09\uFF1A\u638C\u63E1\u5317\u4EAC\u653F\u5E9C\uFF0C\u63A7\u5236\u5B89\u5FBD\u3001\u6D59\u6C5F\u3001\u5C71\u4E1C\u3001\u798F\u5EFA\u3001\u9655\u897F\uFF1B\u5949\u7CFB\uFF08\u5F20\u4F5C\u9716\uFF09\uFF1A\u76D8\u8E1E\u4E1C\u5317\u3002"

					unitId: "u-b8a-03",
					title: "\u519B\u9600\u5272\u636E\u5371\u5BB3",
					content: "\u519B\u9600\u4E3A\u4E89\u593A\u5730\u76D8\uFF0C\u4E0D\u60DC\u51FA\u5356\u56FD\u5BB6\u5229\u76CA\uFF0C\u4F9D\u9644\u5E1D\u56FD\u4E3B\u4E49\uFF1B\u8FDE\u5E74\u6DF7\u6218\uFF0C\u4E2D\u56FD\u9677\u5165\u519B\u9600\u5272\u636E\u7EB7\u4E89\u7684\u52A8\u4E71\u4E4B\u4E2D\u3002"

					unitId: "u-b8a-03",
					title: "\u62A4\u6CD5\u8FD0\u52A8",
					content: '1917\u5E74\u5B59\u4E2D\u5C71\u5728\u5E7F\u5DDE\u7EC4\u7EC7\u62A4\u6CD5\u519B\u653F\u5E9C\uFF0C\u53CD\u5BF9\u5317\u6D0B\u519B\u9600\u5E9F\u5F03\u300A\u4E34\u65F6\u7EA6\u6CD5\u300B\u3002\u56E0\u5357\u5317\u519B\u9600\u59A5\u534F\u800C\u5931\u8D25\uFF0C\u5B59\u4E2D\u5C71\u8BA4\u8BC6\u5230"\u5357\u4E0E\u5317\u5982\u4E00\u4E18\u4E4B\u8C89"\u3002'

				{

					unitId: "u-b8a-04",
					title: "\u65B0\u6587\u5316\u8FD0\u52A8\u5174\u8D77",
					content: "\u80CC\u666F\uFF1A\u8F9B\u4EA5\u9769\u547D\u5931\u8D25\u540E\u653F\u6CBB\u6DF7\u4E71\uFF0C\u5148\u8FDB\u77E5\u8BC6\u5206\u5B50\u4E3B\u5F20\u601D\u60F3\u6587\u5316\u9769\u65B0\u3002\u6807\u5FD7\uFF1A1915\u5E74\u9648\u72EC\u79C0\u5728\u4E0A\u6D77\u521B\u529E\u300A\u9752\u5E74\u6742\u5FD7\u300B\uFF08\u540E\u6539\u540D\u300A\u65B0\u9752\u5E74\u300B\uFF09\u3002\u4EE3\u8868\u4EBA\u7269\uFF1A\u9648\u72EC\u79C0\u3001\u80E1\u9002\u3001\u674E\u5927\u948A\u3001\u9C81\u8FC5\u3002\u4E3B\u8981\u9635\u5730\uFF1A\u5317\u4EAC\u5927\u5B66\u548C\u300A\u65B0\u9752\u5E74\u300B\u7F16\u8F91\u90E8\u3002"
				},
				{

					lessonId: "l-b8a-11",
					unitId: "u-b8a-04",
					title: "\u65B0\u6587\u5316\u8FD0\u52A8\u53E3\u53F7\u4E0E\u5185\u5BB9",
					content: "\u57FA\u672C\u53E3\u53F7\uFF1A\u6C11\u4E3B\u4E0E\u79D1\u5B66\u3002\u601D\u60F3\u9769\u547D\uFF1A\u62A8\u51FB\u65E7\u9053\u5FB7\u548C\u65E7\u6587\u5316\uFF1B\u6587\u5B66\u9769\u547D\uFF1A\u4E3B\u5F20\u4EE5\u767D\u8BDD\u6587\u4F5C\u4E3A\u65B0\u6587\u5B66\u7684\u8BED\u8A00\u3002"
				},
				{

					lessonId: "l-b8a-11",
					unitId: "u-b8a-04",
					title: "\u65B0\u6587\u5316\u8FD0\u52A8\u610F\u4E49",
					content: "\u52A8\u6447\u4E86\u5C01\u5EFA\u9053\u5FB7\u793C\u6559\u7684\u7EDF\u6CBB\u5730\u4F4D\uFF0C\u6380\u8D77\u4E86\u601D\u60F3\u89E3\u653E\u7684\u6F6E\u6D41\uFF0C\u4E3A\u4E94\u56DB\u8FD0\u52A8\u8D77\u4E86\u601D\u60F3\u5BA3\u4F20\u548C\u94FA\u57AB\u4F5C\u7528\u3002"
				},
				{

					lessonId: "l-b8a-11",
					unitId: "u-b8a-04",
					title: "\u4E94\u56DB\u8FD0\u52A8\u5BFC\u706B\u7EBF",
					content: '1919\u5E74\u5DF4\u9ECE\u548C\u4F1A\u4E0A\uFF0C\u4E2D\u56FD\u4EE3\u8868\u63D0\u51FA\u5E9F\u9664\u5916\u56FD\u5728\u534E\u7279\u6743\u3001\u53D6\u6D88"\u4E8C\u5341\u4E00\u6761"\u3001\u6536\u56DE\u9752\u5C9B\u4E3B\u6743\u7B49\u6B63\u5F53\u8981\u6C42\u88AB\u62D2\u7EDD\uFF0C\u5217\u5F3A\u5C06\u5FB7\u56FD\u5728\u5C71\u4E1C\u7684\u7279\u6743\u5168\u90E8\u8F6C\u8BA9\u7ED9\u65E5\u672C\u3002'

					lessonId: "l-b8a-11",
					unitId: "u-b8a-04",
					title: "\u4E94\u56DB\u8FD0\u52A8\u53E3\u53F7",
					content: '"\u5916\u4E89\u4E3B\u6743\u3001\u5185\u9664\u56FD\u8D3C""\u8A93\u6B7B\u529B\u4E89\u3001\u8FD8\u6211\u9752\u5C9B"\u7B49\u3002'
				},
				{
					id: "kp-b8a-l11-06",
					lessonId: "l-b8a-11",
					unitId: "u-b8a-04",
					title: "\u8FD0\u52A8\u4E24\u4E2A\u9636\u6BB5",
					content: "\u524D\u671F\uFF085\u67084\u65E5\u8D77\uFF09\uFF1A\u4E2D\u5FC3\u5317\u4EAC\uFF0C\u4E3B\u529B\u9752\u5E74\u5B66\u751F\uFF0C\u5F62\u5F0F\u5B66\u751F\u793A\u5A01\u6E38\u884C\u7F62\u8BFE\uFF1B\u540E\u671F\uFF086\u67085\u65E5\u8D77\uFF09\uFF1A\u4E2D\u5FC3\u4E0A\u6D77\uFF0C\u4E3B\u529B\u5DE5\u4EBA\u9636\u7EA7\uFF0C\u5F62\u5F0F\u5DE5\u4EBA\u7F62\u5DE5\u3001\u5B66\u751F\u7F62\u8BFE\u3001\u5546\u4EBA\u7F62\u5E02\u3002"
				},

					unitId: "u-b8a-04",
					title: "\u521D\u6B65\u80DC\u5229",
					content: "\u88AB\u6355\u5B66\u751F\u91CA\u653E\u3001\u4EB2\u65E5\u6D3E\u5356\u56FD\u8D3C\u88AB\u7F62\u514D\u3001\u4E2D\u56FD\u4EE3\u8868\u62D2\u7EDD\u5728\u548C\u7EA6\u4E0A\u7B7E\u5B57\u3002"
				},
				{

					lessonId: "l-b8a-11",
					unitId: "u-b8a-04",
					title: "\u5386\u53F2\u5730\u4F4D",
					content: "\u662F\u4E00\u573A\u5F7B\u5E95\u53CD\u5E1D\u53CD\u5C01\u5EFA\u7684\u4F1F\u5927\u7231\u56FD\u9769\u547D\u8FD0\u52A8\uFF1B\u63A8\u52A8\u4E86\u4E2D\u56FD\u793E\u4F1A\u8FDB\u6B65\uFF0C\u4FC3\u8FDB\u4E86\u9A6C\u514B\u601D\u4E3B\u4E49\u5728\u4E2D\u56FD\u7684\u4F20\u64AD\u53CA\u5176\u4E0E\u4E2D\u56FD\u5DE5\u4EBA\u8FD0\u52A8\u7684\u7ED3\u5408\uFF0C\u4E3A\u4E2D\u56FD\u5171\u4EA7\u515A\u6210\u7ACB\u505A\u4E86\u601D\u60F3\u4E0A\u5E72\u90E8\u4E0A\u7684\u51C6\u5907\uFF1B\u662F\u4E2D\u56FD\u65E7\u6C11\u4E3B\u4E3B\u4E49\u9769\u547D\u8D70\u5411\u65B0\u6C11\u4E3B\u4E3B\u4E49\u9769\u547D\u7684\u8F6C\u6298\u70B9\u3002"
				},
				{

					unitId: "u-b8a-04",
					title: "\u4E94\u56DB\u7CBE\u795E",
					content: "\u4EE5\u7231\u56FD\u3001\u8FDB\u6B65\u3001\u6C11\u4E3B\u3001\u79D1\u5B66\u4E3A\u4E3B\u8981\u5185\u5BB9\uFF0C\u6838\u5FC3\u662F\u7231\u56FD\u4E3B\u4E49\u7CBE\u795E\u3002"
				},
				{

	<script id="qx-mobile-js">
		(function () {
			var btn = document.getElementById("qx-nav-toggle");
			if (!btn)
				return;
			function set(on) {
				document.body.classList.toggle("mnav", on);
				btn.textContent = on ? "收起" : "目录";
			}
			btn.addEventListener("click", function () {
				set(!document.body.classList.contains("mnav"));
			});
			document.addEventListener(
				"click",
				function (e) {
					if (!document.body.classList.contains("mnav"))
						return;
					var t = e.target;
					if (t.closest && t.closest(".sidebar") && (t.closest(".lesson-item") || t.closest(".nav button")))
						set(false);
				},
				true
			);
			var mq = window.matchMedia("(max-width:860px)");
			function sync() {
				if (!mq.matches)
					set(false);
			}
			(mq.addEventListener ? mq.addEventListener("change", sync) : mq.addListener(sync));
		})();
	</script>

	<script id="qx-flag-js">
		/* 题目小旗：学生点一下=这题题干/答案有问题，直接写入云端 question_flags 表。
   看板 board.html 的「学生标记的疑问题」读这张表。 */
		(function () {
			"use strict";
			/* 册次：必须与上方 QX_VOL 及 board.html 的 VOL 一致（tools/check_question_sync.py 会校验） */
			var VOL = "b8a";
			var ENDPOINT = "https://grade8-history-quiz-31453.app.workbuddy.host";
			var KEY = "wbpk_2hg0DGLqWMsqxQq3W4QbsX_EDIfnmEJeboAQgGxBl1vxM6WeH48Uiqp";
			var TABLE = "/.cloud/database/rest/v1/question_flags";
			var K_FLAG = "hx.flag.v1",
			K_DEV = "hx.dev.v1";
			var CS = "0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz-_";
			var REASONS = [["stem", "题干表述不清"], ["answer", "答案/解析有误"], ["option", "选项不对"], ["other", "其他问题"]];
			function rd(k, d) {
				try {
					var v = localStorage.getItem(k);
					return v ? JSON.parse(v) : d;
				} catch (e) {
					return d;
				}
			}
			function wr(k, v) {
				try {
					localStorage.setItem(k, JSON.stringify(v));
				} catch (e) {}
			}
			function dev() {
				var d = rd(K_DEV, "");
				if (typeof d === "string" && /^[0-9A-Za-z_-]{4}$/.test(d))
					return d;
				var s = "",
				i;
				for (i = 0; i < 4; i++)
					s += CS.charAt(Math.floor(Math.random() * 64));
				wr(K_DEV, s);
				return s;
			}
			function sid() {
				return "hx-" + VOL + "-" + dev();
			}
			function flags() {
				var o = rd(K_FLAG, {});
				return o && typeof o === "object" ? o : {};
			}
			function isOn(qid) {
				var f = flags()[qid];
				return !!(f && f.a);
			}
			function setLocal(qid, on, reason) {
				var f = flags();
				if (on)
					f[qid] = {
						a: 1,
						r: reason || "",
						t: Date.now(),
						p: 0
					};
				else
					delete f[qid];
				wr(K_FLAG, f);
			}
			/* 写云端：flag_key=<会话>|<题号> 作主键 upsert，同一设备同一题只有一行，重复点不会堆记录 */
			function push(qid, on, reason) {
				var id = sid(),
				body = {
					flag_key: id + "|" + qid,
					session_id: id,
					volume: VOL,
					question_id: qid,
					reason: reason || null,
					active: !!on,
					updated_at: new Date().toISOString()
				};
				try {
					return fetch(
						ENDPOINT + TABLE + "?on_conflict=flag_key",
						{
							method: "POST",
							keepalive: true,
							headers: {
								"Content-Type": "application/json",
								"x-wb-webapp-access-key": KEY,
								"x-upsert": "true",
								"Prefer": "resolution=merge-duplicates"
							},
							body: JSON.stringify(body)
						}
					).then(
						function (r) {
							if (!r.ok)
								throw new Error("HTTP " + r.status);
							markPushed(qid, true);
							return true;
						}
					).catch(
						function () {
							/* 直连接口失败时改用官方 SDK 再试一次，避免鉴权抖动导致反馈丢失 */
							return pushSdk(qid, on, reason);
						}
					);
				} catch (e) {
					return pushSdk(qid, on, reason);
				}
			}
			function markPushed(qid, ok) {
				var f = flags();
				if (f[qid]) {
					f[qid].p = ok ? 1 : 0;
					wr(K_FLAG, f);
				}
			}
			var sdk = null;
			function sdkClient() {
				if (sdk)
					return sdk;
				try {
					if (window.WorkBuddyCloud && window.WorkBuddyCloud.createWorkBuddyCloud)
						sdk = window.WorkBuddyCloud.createWorkBuddyCloud({
							endpoint: ENDPOINT,
							publishableKey: KEY
						});
				} catch (e) {
					sdk = null;
				}
				return sdk;
			}
			function pushSdk(qid, on, reason) {
				var c = sdkClient();
				if (!c || !c.database) {
					markPushed(qid, false);
					return Promise.resolve(false);
				}
				try {
					return c.database.from("question_flags").upsert(
						{
							flag_key: sid() + "|" + qid,
							session_id: sid(),
							volume: VOL,
							question_id: qid,
							reason: reason || null,
							active: !!on,
							updated_at: new Date().toISOString()
						},
						{
							onConflict: "flag_key"
						}
					).then(function (res) {
						var ok = !(res && res.error);
						markPushed(qid, ok);
						return ok;
					}).catch(function () {
						markPushed(qid, false);
						return false;
					});
				} catch (e) {
					markPushed(qid, false);
					return Promise.resolve(false);
				}
			}
			/* 上次没推送成功的标记，进入页面时补推一次（每设备最多两三条） */
			function retry() {
				var f = flags();
				Object.keys(f).forEach(function (q) {
					if (f[q] && f[q].a && f[q].p !== 1)
						push(q, true, f[q].r);
				});
			}
			var toastEl = null,
			toastTimer = null;
			function toast(msg) {
				if (!toastEl) {
					toastEl = document.createElement("div");
					toastEl.className = "qx-toast";
					document.body.appendChild(toastEl);
				}
				toastEl.textContent = msg;
				toastEl.className = "qx-toast on";
				if (toastTimer)
					clearTimeout(toastTimer);
				toastTimer = setTimeout(function () {
					toastEl.className = "qx-toast";
				}, 2400);
			}
			var bar = null,
			barTimer = null;
			function closeBar() {
				if (bar) {
					if (bar.parentNode)
						bar.parentNode.removeChild(bar);
					bar = null;
				}
				if (barTimer) {
					clearTimeout(barTimer);
					barTimer = null;
				}
			}
			function openBar(qid) {
				closeBar();
				var cur = flags()[qid] || {};
				bar = document.createElement("div");
				bar.className = "qx-bar";
				bar.dataset.qid = qid;
				var chips = REASONS.map(
					function (x) {
						return '<button type="button" class="qx-chip' + (cur.r === x[0] ? " on" : "") + '" data-r="' + x[0] + '">' + x[1] + "</button>";
					}
				).join("");
				bar.innerHTML = '<h4>这题已标记，谢谢！</h4>' + '<p>哪里有问题？选一个能让老师改得更准（也可以不选，直接关掉）。</p>' + '<div class="qx-chips">' + chips + "</div>" + '<div class="qx-bar-foot"><span class="qx-bar-note">老师会在看板上看到这条反馈</span>' + '<button type="button" class="qx-bar-x">撤销标记</button></div>';
				bar.querySelector(".qx-chips").addEventListener(
					"click",
					function (e) {
						var b = e.target.closest ? e.target.closest(".qx-chip") : null;
						if (!b)
							return;
						var all = bar.querySelectorAll(".qx-chip"),
						i;
						for (i = 0; i < all.length; i++)
							all[i].className = "qx-chip";
						b.className = "qx-chip on";
						setLocal(qid, true, b.dataset.r);
						push(qid, true, b.dataset.r);
						bar.querySelector("h4").textContent = "这题已标记：" + b.textContent;
						bar.querySelector("p").textContent = "老师会在看板上看到这条反馈，改好后可以再点一次小旗取消。";
					}
				);
				bar.querySelector(".qx-bar-x").addEventListener(
					"click",
					function () {
						setLocal(qid, false);
						push(qid, false, null);
						closeBar();
						refreshBtn(qid);
						toast("已取消标记");
					}
				);
				document.body.appendChild(bar);
				barTimer = setTimeout(closeBar, 15000);
			}
			function refreshBtn(qid) {
				var btn = document.querySelector(".qcard .qx-flag");
				if (!btn || btn.dataset.qid !== qid)
					return;
				var on = isOn(qid);
				btn.className = "qx-flag" + (on ? " on" : "");
				var t = btn.querySelector(".qx-ft");
				if (t)
					t.textContent = on ? "已标记" : "这题有问题";
				btn.title = on ? "再点一次取消标记" : "题干表述或答案有问题？点这里告诉老师";
			}
			function toggle(btn) {
				var qid = btn.dataset.qid;
				if (!qid)
					return;
				if (isOn(qid)) {
					setLocal(qid, false);
					push(qid, false, null);
					closeBar();
					refreshBtn(qid);
					toast("已取消标记");
				} else {
					setLocal(qid, true, "");
					refreshBtn(qid);
					openBar(qid);
					push(qid, true, "").then(function (ok) {
						if (!ok)
							toast("已标记，等下次打开页面会自动补传");
					});
				}
			}
			function ensure() {
				var card = document.querySelector(".qcard");
				if (!card)
					return;
				var qid = window.__QXQID;
				if (!qid || !/^q-/.test(String(qid)))
					return;
				var meta = card.querySelector(".qmeta");
				if (!meta)
					return;
				var btn = meta.querySelector(".qx-flag");
				if (!btn) {
					btn = document.createElement("button");
					btn.type = "button";
					btn.className = "qx-flag";
					btn.innerHTML = '<span class="qx-fi">\u2691</span><span class="qx-ft">这题有问题</span>';
					btn.addEventListener("click", function (e) {
						if (e) {
							e.preventDefault();
							e.stopPropagation();
						}
						toggle(btn);
					});
					meta.appendChild(btn);
				}
				btn.dataset.qid = qid;
				refreshBtn(qid);
				if (bar && bar.dataset.qid !== qid)
					closeBar();
			}
			var pend = false;
			function scan() {
				if (pend)
					return;
				pend = true;
				var run = function () {
					pend = false;
					try {
						ensure();
					} catch (e) {}
				};
				if (window.requestAnimationFrame)
					requestAnimationFrame(run);
				else
					setTimeout(run, 60);
			}
			try {
				new MutationObserver(scan).observe(document.documentElement, {
					childList: true,
					subtree: true
				});
			} catch (e) {}
			if (document.readyState === "loading")
				document.addEventListener("DOMContentLoaded", scan);
			else
				scan();
			setTimeout(scan, 400);
			retry();
		})();
	</script>
